
[workspace]
name = "als_tiled"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "linux-aarch64"]

[environments.default]
features = ["bl733"]

[dependencies]
python = "3.13.*"
pip = "*"
pytest = "*"
pytest-cov = "*"
pytest-asyncio = "*"
mypy = "*"
ipython = "*"
notebook = "*"
tiled = "*"
httpx = "*"
typer = "*"
pyyaml = "*"
fabio = "*"
zarr = "*"
numpy = "*"
pandas = "*"
black = "*"
isort = "*"
flake8 = "*"
pre-commit = "*"

[feature.bl733.dependencies]
fabio = "*"

[tasks]
test = "pytest --cov=splash_tiled --cov-report=term-missing"
lint = "flake8 src tests && black --check src tests && isort --check-only src tests && mypy src"
format = "black src tests && isort src tests"
als-hub = "als-hub --db-path ./esafs.sqlite3"
compile-tags = "compile-tags"
compile-tags-db = "compile-tags compile --esaf-sqlite-path ./tags/esafs.sqlite3 --output-sqlite-path ./tags/compiled_tags.sqlite3"
generate-tags-yaml = "compile-tags generate-yaml --esaf-sqlite-path ./tags/esafs.sqlite3 --output-yaml-path ./tags/tag_definitions.generated.yml"
