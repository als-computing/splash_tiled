[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "splash_tiled"
version = "0.2.8.1a4"
description = "A tiled-based data management system for the Advanced Light Source"
readme = "README.md"
authors = [
    {name = "ALS Team", email = "contact@als.lbl.gov"},
]
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "PyYAML>=6",
  "typer>=0.12",
  "APScheduler>=3.10",
  "tiled[client]>=0.2.8",
]

[project.optional-dependencies]
tiled-all = [
  "tiled[all]>=0.2.8",
]
bl733 = [
  "fabio",
]
dev = [
  "flake8",
  "black",
  "isort",
  "mypy",
  "pytest",
  "pytest-cov",
  "pytest-asyncio",
  "fabio",
  "tiled[server] @ file:///${PROJECT_ROOT}/../tiled"
]

[project.urls]
Homepage = "https://github.com/als-lbl/splash_tiled"
Repository = "https://github.com/als-lbl/splash_tiled"
Documentation = "https://github.com/als-lbl/splash_tiled#readme"

[project.scripts]
als-hub = "splash_tiled.access_control.user_office:main"
compile-tags = "splash_tiled.access_control.tiled_tags:main"
access-query = "splash_tiled.access_control.inspect:main"
access = "splash_tiled.access_control.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.black]
line-length = 88
target-version = ["py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=splash_tiled --cov-report=term-missing"
testpaths = [
    "tests",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
