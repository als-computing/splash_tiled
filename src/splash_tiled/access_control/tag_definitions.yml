roles:
  facility_user:
    scopes: ["read:data", "read:metadata"]
  facility_admin:
    scopes: ["read:data", "read:metadata",
             "write:data", "write:metadata",
             "delete:node", "delete:revision",
             "create:node", "register"]
tags:
  SB-01482-001:
    groups:
      - name: SB-01482-001
        role: facility_user
    auto_tags:
      - name: data_admin

  data_admin:
    users:
      - name: cara
        role: facility_admin
tag_owners:
  data_admin:
    users:
      - name: cara
